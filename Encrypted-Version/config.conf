# Audio Burst Transfer System - CONFIG
# config.conf

# =========================
# MINIMODEM SETTINGS
# =========================
rate="2400"              # Baud rate (try 1200 / 2400 / 4800 / 9600)
wav_out="burst.wav"      # TX output WAV file
wav_in=""                # RX input (set dynamically)

# =========================
# FILE SETTINGS
# =========================
output_dir="./output"    # Where decoded files are stored
temp_dir="/tmp/audioburst"

# =========================
# ENCRYPTION (AES-256)
# =========================
enable_aes="1"           # 1 = on, 0 = off
aes_pass="changeme"      # password for AES encryption

# =========================
# INTEGRITY
# =========================
enable_sha256="1"        # SHA256 verification per file
enable_crc32="1"         # CRC32 per packet (lightweight)

# =========================
# PACKET SYSTEM
# =========================
packet_size="512"        # bytes per chunk before base64
duplicate_packets="2"    # redundancy factor
start_marker="START"
end_marker="END"

# =========================
# TIMING / SIGNAL QUALITY
# =========================
silence_gap_ms="150"     # gap between packets (if stitched WAV used)
auto_retry="1"           # retransmit failed packets (future TX/RX mode)

# =========================
# ADVANCED (FUTURE USE)
# =========================
adaptive_baud="0"        # NOT active in WAV mode (requires live duplex)
ack_mode="0"             # NOT supported in single WAV file mode
EOP_MARKER="|EOP|"
# =========================
# SYSTEM
# =========================
log_enabled="1"
log_file="./output/audioburst.log"
